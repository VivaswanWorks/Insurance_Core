<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insurance Portal</title>
    <link rel="icon" href="/assets/insurance_core/frontend/favicon.png" />
    <link rel="stylesheet" href="/assets/insurance_core/frontend/index.css" />
  </head>
  <body class="bg-gray-50">
    <div id="app"></div>
    <div id="modals"></div>
    <div id="popovers"></div>

    {# Real CSRF token injected by Frappe when serving this www page #}
    <script>
      window.csrf_token = "{{ csrf_token }}";
      window.frappe = window.frappe || {};
      window.frappe.boot = window.frappe.boot || {};
      if (!window.frappe.boot.csrf_token) {
        window.frappe.boot.csrf_token = window.csrf_token;
      }
    </script>
    <script type="module" src="/assets/insurance_core/frontend/main.js"></script>
  </body>
</html>
